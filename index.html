<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seven Times — Заявки кандидатов</title>
<style>
:root{
  --bg:#fbfbfd; --surface:#ffffff; --text:#1d1d1f; --muted:#86868b; --line:#e5e5e7;
  --accent:#7a1f2e; --accent-soft:#7a1f2e14; --good:#1a7d3c; --warn:#b8860b; --bad:#c23616;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased;
}
.topbar{
  padding:16px 20px; display:flex; align-items:center; gap:16px;
  border-bottom:1px solid var(--line);
}
.brand{font-weight:600; font-size:15px; letter-spacing:-.01em;}
input[type=text],input[type=password]{
  font-size:16px; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line);
  background:var(--surface); color:var(--text); outline:none; font-family:inherit; width:100%;
}
input[type=text]:focus,input[type=password]:focus{ border-color:var(--accent); }
.btn{
  padding:12px 20px; border-radius:10px; border:none; cursor:pointer;
  font-size:15px; font-weight:600; font-family:inherit;
}
.btn-primary{ background:var(--accent); color:#fff; }
.btn-primary:disabled{ background:#d1d1d6; cursor:not-allowed; }
.btn-ghost{ background:transparent; color:var(--text); border:1.5px solid var(--line); }
.gate{ max-width:360px; margin:100px auto; text-align:center; padding:0 20px; }
.gate h2{ font-size:22px; margin-bottom:8px; }
.gate p{ color:var(--muted); font-size:14px; margin-bottom:20px; }
.gate input{ text-align:center; margin-bottom:14px; }
.err{ color:var(--bad); font-size:13px; margin-top:10px; display:none; }
.err.show{ display:block; }
.admin-wrap{ max-width:1100px; margin:0 auto; padding:28px 20px 80px; display:none; }
.admin-wrap.show{ display:block; }
.admin-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:14px; }
.admin-title{ font-size:26px; font-weight:700; letter-spacing:-.02em; }
.admin-sub{ color:var(--muted); font-size:14px; margin-top:4px; }
.stats-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; margin-bottom:26px; }
.stat-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 20px; }
.stat-card .n{ font-size:24px; font-weight:700; letter-spacing:-.02em; }
.stat-card .l{ font-size:13px; color:var(--muted); margin-top:2px; }
.filters{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
.fchip{ padding:8px 14px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface); font-size:13px; font-weight:600; cursor:pointer; color:var(--muted); }
.fchip.active{ background:var(--text); color:#fff; border-color:var(--text); }
.table-wrap{ background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden; overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-size:14px; min-width:760px; }
th{ text-align:left; padding:13px 15px; color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--line); background:#fafafa; }
td{ padding:13px 15px; border-bottom:1px solid var(--line); vertical-align:top; }
tr:last-child td{ border-bottom:none; }
tr.row-detail{ cursor:pointer; }
tr.row-detail:hover{ background:#fafafa; }
.detail-row{ display:none; background:#fafafa; }
.detail-row.open{ display:table-row; }
.detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 24px; padding:6px 0; }
.detail-grid .k{ color:var(--muted); font-size:12px; }
.detail-grid .v{ font-size:14px; margin-top:2px; }
.empty{ text-align:center; padding:60px 20px; color:var(--muted); }
.loading{ text-align:center; padding:60px 20px; color:var(--muted); }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">Seven Times · HR</div>
</div>

<div class="gate" id="adminGate">
  <h2>Доступ к анкетам</h2>
  <p>Введите пароль отдела кадров</p>
  <input type="password" id="adminPass" placeholder="Пароль" autocomplete="current-password" onkeydown="if(event.key==='Enter')adminLogin()">
  <button class="btn btn-primary" style="width:100%;" onclick="adminLogin()">Войти</button>
  <div class="err" id="adminErr">Неверный пароль</div>
</div>

<div class="admin-wrap" id="adminPanel">
  <div class="admin-top">
    <div>
      <div class="admin-title">Заявки кандидатов</div>
      <div class="admin-sub" id="adminSub">—</div>
      <div class="admin-sub" id="adminWho" style="color:var(--accent); font-weight:600;"></div>
      <div id="hrOnlineIndicator" style="display:none;margin-top:6px;font-size:13px;color:var(--good);font-weight:600"></div>
      <style>#hrOnlineIndicator::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:1px}</style>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="btn btn-ghost" onclick="hrChatOpen()" style="position:relative">
        Чат
        <span id="hrChatBadge" style="display:none;position:absolute;top:-6px;right:-6px;width:9px;height:9px;border-radius:50%;background:var(--bad)"></span>
      </button>
      <button class="btn btn-ghost" onclick="loadApplications()">Обновить</button>
      <button class="btn btn-ghost" onclick="hrLogout()">Выйти</button>
    </div>
  </div>

  <div class="stats-row" id="statsRow"></div>
  <div class="filters" id="filters"></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Имя</th><th>Должность</th><th>Возраст</th><th>Опыт работы</th>
          <th>Статус</th><th>Обработал(а)</th><th>Дата</th>
        </tr>
      </thead>
      <tbody id="tbody"><tr><td colspan="7" class="loading">Загрузка…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
/* Вставь сюда URL деплоя того же Apps Script, что и у основного сайта меню —
   анкеты вакансий (лист "Вакансия") пишутся именно туда */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyfTiJvKqZwWG8jetjumWVMK6cA6HqIlyWSXs4lkkbL23wlQlJzd0JWKuBY0B0uNylDKQ/exec";

// Всё, что пишут кандидаты в анкете, и сообщения чата выводим только экранированными:
// иначе кандидат мог вписать в анкету код, который выполнится у отдела кадров.
function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// запрос с таймаутом — чтобы кнопки не зависали навсегда при плохой сети
function getJson(url, opts, ms){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms || 20000);
  return fetch(url, Object.assign({ signal: ctl.signal }, opts || {})).then(r => r.json()).finally(() => clearTimeout(t));
}

let ALL_APPS = [];
let ACTIVE_FILTER = 'all';

function adminLogin(){
  const pass = document.getElementById('adminPass').value;
  if(!pass) return;
  document.getElementById('adminErr').classList.remove('show');
  tryLoadWithKey(pass, false);
}

async function tryLoadWithKey(key, silent){
  const btn = document.querySelector('#adminGate button');
  if(!silent && btn) btn.textContent = 'Проверяем…';
  try{
    const data = await getJson(SCRIPT_URL + '?action=hrList&key=' + encodeURIComponent(key));
    if(data.ok){
      sessionStorage.setItem('st_hr_admin_key', key);
      sessionStorage.setItem('st_hr_admin_name', data.adminName || '');
      ALL_APPS = data.rows || [];
      showAdminPanel();
    } else {
      sessionStorage.removeItem('st_hr_admin_key');
      sessionStorage.removeItem('st_hr_admin_name');
      if(!silent) document.getElementById('adminErr').classList.add('show');
    }
  }catch(err){
    if(!silent) document.getElementById('adminErr').classList.add('show');
  } finally {
    if(btn) btn.textContent = 'Войти';
  }
}

function showAdminPanel(){
  document.getElementById('adminGate').style.display = 'none';
  document.getElementById('adminPanel').classList.add('show');
  const name = sessionStorage.getItem('st_hr_admin_name') || '';
  document.getElementById('adminWho').textContent = name ? `Вы вошли как: ${name}` : '';
  renderAdminStats();
  renderFilters();
  renderTable();
  hrStartPresenceAndChat();
}

// ── "В СЕТИ" — раз в 20 сек сообщаем о себе, узнаём кто ещё активен ──
let hrPresenceTimer = null;
let hrChatPollTimer = null;
let hrAppsRefreshTimer = null;
let hrChatMessages = [];

function hrLogout(){
  sessionStorage.removeItem('st_hr_admin_key');
  sessionStorage.removeItem('st_hr_admin_name');
  clearInterval(hrPresenceTimer);
  clearInterval(hrChatPollTimer);
  clearInterval(hrAppsRefreshTimer);
  document.getElementById('adminPanel').classList.remove('show');
  document.getElementById('adminGate').style.display = 'block';
  document.getElementById('adminPass').value = '';
}

function hrStartPresenceAndChat(){
  hrPing();
  hrChatFetch();
  // раньше таймеры объявлялись, но не запускались — ничего не обновлялось само
  clearInterval(hrPresenceTimer); clearInterval(hrChatPollTimer); clearInterval(hrAppsRefreshTimer);
  hrPresenceTimer = setInterval(() => { if(!document.hidden) hrPing(); }, 30000);
  hrChatPollTimer = setInterval(() => { if(!document.hidden) hrChatFetch(); }, 10000);
  hrAppsRefreshTimer = setInterval(() => { if(!document.hidden && !hrEditingId) hrSilentRefreshApplications(); }, 30000);
}
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && sessionStorage.getItem('st_hr_admin_key')){ hrPing(); hrChatFetch(); hrSilentRefreshApplications(); }
});

async function hrPing(){
  const key = sessionStorage.getItem('st_hr_admin_key');
  if(!key) return;
  try{
    const data = await getJson(SCRIPT_URL + '?action=hrPing&key=' + encodeURIComponent(key));
    if(data.ok){
      const el = document.getElementById('hrOnlineIndicator');
      if(data.othersOnline && data.othersOnline.length){
        el.style.display = 'block';
        el.textContent = 'В сети: ' + data.othersOnline.join(', ');
      } else {
        el.style.display = 'none';
      }
    }
  }catch(err){}
}

async function hrChatFetch(){
  const key = sessionStorage.getItem('st_hr_admin_key');
  if(!key) return;
  try{
    const data = await getJson(SCRIPT_URL + '?action=hrChatList&key=' + encodeURIComponent(key));
    if(data.ok){
      const isNewMsgs = (data.messages || []).length > hrChatMessages.length;
      hrChatMessages = data.messages || [];
      hrRenderChat();
      const ov = document.getElementById('hrChatOv');
      const myName = sessionStorage.getItem('st_hr_admin_name') || '';
      const lastMsg = hrChatMessages[hrChatMessages.length - 1];
      if(isNewMsgs && lastMsg && lastMsg.sender !== myName && (!ov || ov.style.display !== 'block')){
        document.getElementById('hrChatBadge').style.display = 'block';
      }
    }
  }catch(err){}
}

function hrRenderChat(){
  const myName = sessionStorage.getItem('st_hr_admin_name') || '';
  const box = document.getElementById('hrChatMessages');
  if(!box) return;
  box.innerHTML = hrChatMessages.map(m => {
    const mine = m.sender === myName;
    const time = m.time ? new Date(m.time).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}) : '';
    return `<div style="align-self:${mine?'flex-end':'flex-start'};max-width:80%">
      <div style="font-size:11px;color:var(--muted);margin-bottom:3px;${mine?'text-align:right':''}">${esc(m.sender)} · ${time}</div>
      <div style="padding:9px 13px;border-radius:14px;background:${mine?'var(--accent)':'#f0f0f0'};color:${mine?'#fff':'var(--text)'};font-size:14px;line-height:1.4;white-space:pre-wrap;word-break:break-word">${esc(m.text)}</div>
    </div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

function hrChatOpen(){
  document.getElementById('hrChatOv').style.display = 'block';
  document.getElementById('hrChatBadge').style.display = 'none';
  hrChatFetch();
}

function hrChatClose(){
  document.getElementById('hrChatOv').style.display = 'none';
}

async function hrChatSend(){
  const key = sessionStorage.getItem('st_hr_admin_key');
  const myName = sessionStorage.getItem('st_hr_admin_name') || '';
  const input = document.getElementById('hrChatInput');
  const text = input.value.trim();
  if(!text || !key) return;
  input.value = '';

  // сразу показываем своё сообщение, не дожидаясь ответа сервера
  hrChatMessages.push({ time: new Date().toISOString(), sender: myName, text: text, pending: true });
  hrRenderChat();

  try{
    const r = await getJson(SCRIPT_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain' },
      body: JSON.stringify({ action:'hrChatSend', key, text })
    });
    if(r && r.ok === false) throw new Error('not ok');
    hrChatFetch();
  }catch(err){
    // не молчим: возвращаем текст в поле, чтобы не потерялся
    hrChatMessages = hrChatMessages.filter(m => !(m.pending && m.text === text));
    hrRenderChat();
    input.value = text;
    alert('Сообщение не отправлено — проверьте интернет и попробуйте ещё раз');
  }
}

async function loadApplications(){
  const key = sessionStorage.getItem('st_hr_admin_key');
  if(!key) return;
  document.getElementById('tbody').innerHTML = `<tr><td colspan="7" class="loading">Загрузка…</td></tr>`;
  try{
    const data = await getJson(SCRIPT_URL + '?action=hrList&key=' + encodeURIComponent(key));
    if(data.ok === false){ hrLogout(); return; }
    ALL_APPS = data.rows || [];
    renderAdminStats();
    renderFilters();
    renderTable();
  }catch(err){
    document.getElementById('tbody').innerHTML = `<tr><td colspan="7" class="empty">Не удалось загрузить данные. Проверьте интернет и нажмите «Обновить».</td></tr>`;
  }
}

// Тихое автообновление списка анкет — раз в 30 секунд, без мигания "Загрузка…"
async function hrSilentRefreshApplications(){
  const key = sessionStorage.getItem('st_hr_admin_key');
  if(!key) return;
  try{
    const data = await getJson(SCRIPT_URL + '?action=hrList&key=' + encodeURIComponent(key));
    if(data.ok === false) return;
    ALL_APPS = data.rows || [];
    renderAdminStats();
    renderFilters();
    renderTable();
  }catch(err){}
}

const STATUSES = ["Новая", "Позвонили", "Собеседование назначено", "Принят(а)", "Отказ"];

let hrEditingId = null;

function hrOpenStatusEditor(id){
  const a = ALL_APPS.find(x=>x.id===id);
  if(!a) return;
  hrEditingId = id;
  document.getElementById('hrStatusName').textContent = a.name || '—';
  const sel = document.getElementById('hrStatusSelect');
  const currentIdx = STATUSES.indexOf(a.status || 'Новая');
  const options = STATUSES.filter(s => s !== 'Новая');
  const firstOpenIdx = options.findIndex(s => STATUSES.indexOf(s) > currentIdx || s === 'Отказ');
  sel.innerHTML = options.map((s, i)=>{
    const idx = STATUSES.indexOf(s);
    const isDone = idx <= currentIdx && s !== 'Отказ'; // включая текущий статус — его тоже нельзя выбрать повторно
    const isFirstOpen = i === firstOpenIdx && !isDone;
    return `<option value="${esc(s)}" ${isFirstOpen?'selected':''} ${isDone?'disabled':''}>${esc(s)}${isDone?' (уже выполнено)':''}</option>`;
  }).join('');
  document.getElementById('hrInterviewYearLabel').textContent = 'Дата и время собеседования';
  hrBuildInterviewPickers(a);
  hrStatusSelectChange();
  document.getElementById('hrStatusOv').style.display = 'flex';
}

function hrCloseStatusEditor(){
  document.getElementById('hrStatusOv').style.display = 'none';
  hrEditingId = null;
}

// Ближайшие 30 дней (раньше — только до конца текущего месяца: в конце месяца
// назначить собеседование на начало следующего было нельзя). Значение — "ДД.ММ".
function hrBuildInterviewPickers(a){
  const now = new Date();
  const daySel = document.getElementById('hrInterviewDay');
  const WD = ['вс','пн','вт','ср','чт','пт','сб'];
  let dayOpts = '';
  for(let i=0; i<30; i++){
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate()+i);
    const v = String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0');
    dayOpts += `<option value="${v}">${v}, ${WD[d.getDay()]}${i===0?' (сегодня)':i===1?' (завтра)':''}</option>`;
  }
  daySel.innerHTML = dayOpts;
  if(a.interviewDate){
    const m = String(a.interviewDate).match(/^(\d{1,2})(?:\.(\d{1,2}))?/);
    if(m){ const v = m[1].padStart(2,'0') + '.' + (m[2] ? m[2].padStart(2,'0') : String(now.getMonth()+1).padStart(2,'0')); if([...daySel.options].some(o => o.value === v)) daySel.value = v; }
  }

  const hourSel = document.getElementById('hrInterviewHour');
  let hourOpts = '';
  for(let h=9; h<=21; h++){
    hourOpts += `<option value="${String(h).padStart(2,'0')}:00">${String(h).padStart(2,'0')}:00</option>`;
  }
  hourSel.innerHTML = hourOpts;
  if(a.interviewTime) hourSel.value = a.interviewTime;
}

function hrStatusSelectChange(){
  const val = document.getElementById('hrStatusSelect').value;
  document.getElementById('hrInterviewFields').style.display = (val === 'Собеседование назначено') ? 'block' : 'none';
}

async function hrSaveStatus(){
  if(!hrEditingId) return;
  const key = sessionStorage.getItem('st_hr_admin_key');
  const adminName = sessionStorage.getItem('st_hr_admin_name') || '';
  const newStatus = document.getElementById('hrStatusSelect').value;
  let interviewDate = '', interviewTime = '';
  if(newStatus === 'Собеседование назначено'){
    interviewDate = document.getElementById('hrInterviewDay').value || '';
    interviewTime = document.getElementById('hrInterviewHour').value || '';
  }
  const btn = document.getElementById('hrStatusSaveBtn');
  btn.disabled = true; btn.textContent = 'Сохраняем…';
  try{
    const data = await getJson(SCRIPT_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain' },
      body: JSON.stringify({ action:'hrUpdateStatus', key, id:hrEditingId, status:newStatus, adminName, interviewDate, interviewTime })
    });
    if(!data.ok) alert('Статус не сохранился. Попробуйте ещё раз.');
    if(data.ok){
      const item = ALL_APPS.find(a=>a.id===hrEditingId);
      if(item){
        item.status = newStatus;
        item.processedBy = adminName;
        item.statusChangedAt = new Date().toISOString();
        if(interviewDate) item.interviewDate = interviewDate;
        if(interviewTime) item.interviewTime = interviewTime;
      }
      renderTable();
      hrCloseStatusEditor();
    }
  }catch(err){
    alert('Нет соединения — статус не сохранился. Попробуйте ещё раз.');
  } finally {
    btn.disabled = false; btn.textContent = 'Сохранить';
  }
}

function renderAdminStats(){
  const total = ALL_APPS.length;
  document.getElementById('adminSub').textContent = `Всего заявок: ${total}`;
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="n">${total}</div><div class="l">Всего заявок</div></div>
  `;
}

function renderFilters(){
  const positions = ['all', ...new Set(ALL_APPS.map(a=>a.position).filter(Boolean))];
  window._hrPositions = positions;
  document.getElementById('filters').innerHTML = positions.map((p,i)=>`
    <div class="fchip ${ACTIVE_FILTER===p?'active':''}" onclick="setFilter(window._hrPositions[${i}])">${p==='all'?'Все должности':esc(p)}</div>
  `).join('');
}

function setFilter(p){ ACTIVE_FILTER = p; renderFilters(); renderTable(); }

function renderTable(){
  let rows = ACTIVE_FILTER==='all' ? ALL_APPS : ALL_APPS.filter(a=>a.position===ACTIVE_FILTER);
  rows = rows.slice().sort((a,b)=> new Date(b.timestamp||0) - new Date(a.timestamp||0));
  if(!rows.length){
    document.getElementById('tbody').innerHTML = `<tr><td colspan="7" class="empty">Заявок пока нет</td></tr>`;
    return;
  }
  window._hrRows = rows;
  document.getElementById('tbody').innerHTML = rows.map((a,i)=>`
    <tr class="row-detail" onclick="toggleDetail(${i}, window._hrRows[${i}].id)">
      <td><b>${esc(a.name||'—')}</b></td>
      <td>${esc(a.position||'—')}</td>
      <td>${esc(a.age||'—')}</td>
      <td>${esc(a.experience||'—')}</td>
      <td onclick="event.stopPropagation()">
        <div style="font-size:13px;font-weight:600;margin-bottom:3px">${esc(a.status||'Новая')}</div>
        ${a.processedBy ? `<div style="font-size:11px;color:var(--muted);margin-bottom:4px">${esc(a.processedBy)}${a.statusChangedAt ? ', ' + new Date(a.statusChangedAt).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : ''}</div>` : ''}
        ${a.status === 'Собеседование назначено' && a.interviewDate ? `<div style="font-size:11px;color:var(--accent);font-weight:600;margin-bottom:4px">${esc(a.interviewDate)}${a.interviewTime ? ', ' + esc(a.interviewTime) : ''}</div>` : ''}
        <button onclick="hrOpenStatusEditor(window._hrRows[${i}].id)" style="font-size:11px;padding:5px 10px;border-radius:7px;border:1.5px solid var(--line);background:#fff;cursor:pointer;color:var(--accent);font-weight:600;font-family:inherit">Изменить</button>
      </td>
      <td>${esc(a.processedBy || '—')}</td>
      <td>${a.timestamp ? new Date(a.timestamp).toLocaleDateString('ru-RU') : '—'}</td>
    </tr>
    <tr class="detail-row" id="detail-${i}">
      <td colspan="7">
        <div class="detail-grid">
          <div><div class="k">Телефон</div><div class="v">${esc(a.phone||'—')}</div></div>
          <div><div class="k">Причина увольнения с прошлого места</div><div class="v">${esc(a.leaveReason||'—')}</div></div>
          <div><div class="k">Почему хочет работать у нас</div><div class="v">${esc(a.whyWorkHere||'—')}</div></div>
          <div><div class="k">Удобный график</div><div class="v">${esc(a.schedule||'—')}</div></div>
          <div><div class="k">Предпочитаемый филиал</div><div class="v">${esc(a.preferredBranch||'—')}</div></div>
          <div><div class="k">Откуда узнал(а) о вакансии</div><div class="v">${esc(a.howFound||'—')}</div></div>
        </div>
      </td>
    </tr>
  `).join('');

  rows.forEach((a, i) => {
    if (hrOpenDetailIds.has(a.id)) {
      const detailRow = document.getElementById('detail-' + i);
      if (detailRow) detailRow.classList.add('open');
    }
  });
}

let hrOpenDetailIds = new Set();
function toggleDetail(i, id){
  document.getElementById('detail-'+i).classList.toggle('open');
  if(hrOpenDetailIds.has(id)) hrOpenDetailIds.delete(id); else hrOpenDetailIds.add(id);
}

// Автовход, если пароль уже вводили в этой сессии браузера
(function(){
  const savedKey = sessionStorage.getItem('st_hr_admin_key');
  if(savedKey) tryLoadWithKey(savedKey, true);
})();
</script>

<div id="hrStatusOv" style="display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);align-items:center;justify-content:center;padding:20px" onclick="if(event.target===this)hrCloseStatusEditor()">
  <div style="background:#fff;border-radius:16px;padding:24px 22px;max-width:340px;width:100%">
    <div style="font-weight:700;font-size:17px;margin-bottom:4px" id="hrStatusName">—</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:18px">Изменить статус кандидата</div>
    <select id="hrStatusSelect" onchange="hrStatusSelectChange()" style="width:100%;font-size:14px;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);font-family:inherit;margin-bottom:14px"></select>
    <div id="hrInterviewFields" style="display:none;margin-bottom:14px">
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px" id="hrInterviewYearLabel">Дата и время собеседования</div>
      <div style="display:flex;gap:8px">
        <select id="hrInterviewDay" style="flex:1;font-size:14px;padding:10px;border-radius:10px;border:1.5px solid var(--line);font-family:inherit"></select>
        <select id="hrInterviewHour" style="flex:1;font-size:14px;padding:10px;border-radius:10px;border:1.5px solid var(--line);font-family:inherit"></select>
      </div>
    </div>
    <div style="display:flex;gap:10px">
      <button onclick="hrCloseStatusEditor()" class="btn btn-ghost" style="flex:1">Отмена</button>
      <button id="hrStatusSaveBtn" onclick="hrSaveStatus()" class="btn btn-primary" style="flex:1">Сохранить</button>
    </div>
  </div>
</div>

<div id="hrChatOv" style="display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.3)" onclick="if(event.target===this)hrChatClose()">
  <div style="position:absolute;top:0;right:0;bottom:0;width:min(380px,92vw);background:#fff;display:flex;flex-direction:column">
    <div style="padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between">
      <div style="font-weight:700;font-size:16px">Переписка HR</div>
      <button onclick="hrChatClose()" style="background:none;border:none;cursor:pointer;font-size:20px;color:var(--muted);line-height:1">&times;</button>
    </div>
    <div id="hrChatMessages" style="flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:#f5f3f0"></div>
    <div style="padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px">
      <input type="text" id="hrChatInput" placeholder="Написать…" style="flex:1;font-size:14px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);outline:none;font-family:inherit" onkeydown="if(event.key==='Enter')hrChatSend()">
      <button class="btn btn-primary" onclick="hrChatSend()" style="padding:10px 16px">➤</button>
    </div>
  </div>
</div>
